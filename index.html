<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frecuencia Par — tu parche, tu escudo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Figtree:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#071336;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.16);--txt:#f4f8ff;--mut:#a9bbe0;--lime:#35e85a;--cyan:#00c2ff;--coral:#ff4d6a;--amber:#ffc14d;--grad:linear-gradient(120deg,#35e85a,#00c2ff);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Figtree,system-ui,sans-serif;color:var(--txt);background:radial-gradient(120% 60% at 50% -10%,#0d4fb0 0%,transparent 60%),radial-gradient(70% 40% at 100% 100%,rgba(53,232,90,.22),transparent 70%),var(--ink);background-attachment:fixed;padding:18px 16px 60px;overflow-x:hidden}
.app{max-width:480px;margin:0 auto}
.hidden{display:none!important}
h1,h2{font-family:Unbounded,Figtree,sans-serif}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.stage{position:relative;height:290px;display:grid;place-items:center;margin-top:6px}
.ring{position:absolute;width:190px;height:190px;border-radius:50%;border:2px solid var(--cyan);opacity:0;animation:rg 3.6s ease-out infinite}
.ring:nth-child(2){animation-delay:1.2s;border-color:var(--lime)}
.ring:nth-child(3){animation-delay:2.4s}
@keyframes rg{0%{transform:scale(.7);opacity:.9}100%{transform:scale(2);opacity:0}}
.badge{position:relative;width:178px;background:#fff;border-radius:38px;padding:10px;box-shadow:0 0 0 6px rgba(255,255,255,.12),0 24px 60px rgba(0,194,255,.35)}
.badge img{display:block;width:100%;height:auto;border-radius:28px}
.slogan{font-size:2.15rem;line-height:1.08;font-weight:800;text-align:center;margin:8px 0 10px;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.lead{text-align:center;color:var(--mut);margin:0 0 20px;font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:18px;backdrop-filter:blur(10px);margin-bottom:14px}
input{width:100%;padding:16px;margin-bottom:10px;border-radius:16px;border:1.5px solid var(--line);background:rgba(7,19,54,.7);font-size:1.02rem;font-weight:600}
input::placeholder{color:#7f93bf;font-weight:500}
input:focus{border-color:var(--lime);outline:none;box-shadow:0 0 0 4px rgba(53,232,90,.18)}
.cta{width:100%;border:0;border-radius:18px;padding:17px;font-family:Unbounded,sans-serif;font-weight:800;font-size:1rem;color:#05153a;background:var(--grad);box-shadow:0 10px 30px rgba(0,194,255,.35);cursor:pointer}
.cta:active{transform:scale(.98)}
.alt{text-align:center;margin-top:14px;color:var(--mut);font-size:.92rem}
.link{background:none;border:0;color:var(--cyan);font-weight:800;cursor:pointer;text-decoration:underline;padding:4px}
.err{background:rgba(255,77,106,.2);border:1px solid var(--coral);color:#ffe0e6;border-radius:14px;padding:11px 14px;margin-bottom:12px;font-weight:700;font-size:.9rem}
.err a{color:#fff;font-weight:800;margin-left:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.08);border-radius:999px;padding:9px 13px;font-weight:700;font-size:.84rem;cursor:pointer}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.top h2{margin:0;font-size:1.15rem;line-height:1.2}
.mini{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:rgba(255,255,255,.1);border-radius:999px;padding:6px 11px;font-weight:800;font-size:.82rem;cursor:pointer;text-decoration:none;color:var(--txt);display:inline-flex;gap:6px;align-items:center}
.wa{background:#25d366;border-color:transparent;color:#04230f}
.shield{display:flex;gap:14px;align-items:center}
.shield svg{width:72px;height:86px;flex-shrink:0;filter:drop-shadow(0 6px 18px rgba(0,194,255,.45))}
.shield b{font-family:Unbounded,sans-serif;font-size:1.3rem;display:block;line-height:1.15}
.shield span{color:var(--mut);font-size:.88rem;font-weight:500}
.big{position:relative;display:grid;place-items:center;height:250px}
.pulse{position:relative;width:170px;height:170px;border-radius:50%;border:0;cursor:pointer;background:var(--grad);color:#05153a;font-family:Unbounded,sans-serif;font-weight:800;font-size:1rem;line-height:1.2;box-shadow:0 0 0 10px rgba(0,194,255,.14),0 18px 50px rgba(53,232,90,.4);z-index:2;padding:10px}
.pulse small{display:block;font-family:Figtree,sans-serif;font-weight:700;font-size:.74rem;margin-top:5px;opacity:.75}
.pulse:active{transform:scale(.96)}
.big .ring{width:170px;height:170px;animation-duration:3s}
.big.ping .ring{animation-duration:.9s;opacity:1}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.1);border-radius:16px;padding:14px 10px;font-weight:800;font-size:.9rem;cursor:pointer;text-align:center;text-decoration:none;color:var(--txt)}
.btn.help{background:rgba(255,193,77,.18);border-color:var(--amber);color:#ffe2a6}
.btn.sos{background:var(--coral);border-color:transparent;color:#fff}
.m{display:flex;gap:12px;align-items:center;padding:12px;border-radius:18px;background:rgba(255,255,255,.06);border:1px solid var(--line);margin-bottom:9px}
.m.bad{border-color:var(--coral);background:rgba(255,77,106,.14)}
.m.good{border-color:var(--lime);background:rgba(53,232,90,.1)}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:Unbounded,sans-serif;font-weight:800;color:#05153a;background:var(--grad);flex-shrink:0}
.m .i{flex:1;min-width:0}
.m .i b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m .i span{font-size:.8rem;color:var(--mut);font-weight:600}
.ic{display:flex;gap:6px}
.ic a{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);text-decoration:none;font-size:1.05rem}
details{margin-bottom:14px}
summary{cursor:pointer;font-weight:800;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:18px;list-style:none}
summary::-webkit-details-marker{display:none}
details[open] summary{border-radius:18px 18px 0 0}
.dbody{padding:14px 16px;border:1px solid var(--line);border-top:0;border-radius:0 0 18px 18px;background:rgba(255,255,255,.04)}
.tl{border-left:4px solid;border-radius:0 14px 14px 0;background:rgba(255,255,255,.05);padding:11px 13px;margin-bottom:12px;font-size:.9rem;line-height:1.4}
.tl h3{margin:0 0 7px;font-size:.98rem}
.tl ul{margin:0;padding-left:18px;display:grid;gap:5px}
.tl p{margin:8px 0 0}
.tg{border-color:var(--lime)}.ty{border-color:var(--amber)}.tr{border-color:var(--coral)}
.chk{display:flex;gap:9px;align-items:center;color:var(--mut);font-size:.88rem;margin:2px 0 12px}
.chk input{width:18px;height:18px;margin:0;accent-color:var(--lime)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:#05153a;font-weight:800;padding:12px 18px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:9;max-width:92vw;text-align:center}
select{background:rgba(7,19,54,.8);border:1px solid var(--line);border-radius:12px;padding:7px 10px;font-weight:700}
@media(prefers-reduced-motion:reduce){.ring{animation:none;opacity:.35}}
</style>
</head>
<body>
<main class="app">

<section id="home">
  <div class="stage"><i class="ring"></i><i class="ring"></i><i class="ring"></i>
    <div class="badge"><img src="logo.jpg" alt="Logo de Frecuencia Par"></div>
  </div>
  <h1 class="slogan">Tu parche,<br>tu escudo.</h1>
  <p class="lead">Actívalo en 10 segundos, antes del primer trago.</p>
  <div id="herr" class="err hidden"></div>

  <form id="f-crear" class="card">
    <input id="nom" placeholder="Tu apodo" maxlength="20" autocomplete="off" required>
    <input id="tel" type="tel" placeholder="Celular de alguien de confianza" autocomplete="off" required>
    <button class="cta">Activar mi escudo</button>
    <div class="alt">¿Ya tienen código? <button type="button" class="link" id="b-code">Entrar</button></div>
  </form>

  <form id="f-entrar" class="card hidden">
    <input id="cod" placeholder="Código, ej: FP84K" maxlength="5" autocomplete="off" style="text-transform:uppercase" required>
    <button class="cta">Entrar al parche</button>

        <button class="pill" id="g-dice" type="button" aria-label="Cambiar nombre del parche">🎲</button>

      <path d="M50 6 L92 22 V58 C92 88 70 108 50 116 C30 108 8 88 8 58 V22 Z" fill="none" stroke="url(#gg)" stroke-width="5" stroke-linejoin="round"/>
    </svg>
    <div><b id="s-n">0 de 0</b><span id="s-t"></span></div>

  </div>
  <p id="gps-i" style="color:var(--mut);font-size:.82rem;margin:0 0 16px;text-align:center"></p>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <h2 style="margin:0;font-size:1rem" id="g-count">El parche</h2>
      <label id="who" style="font-size:.82rem;color:var(--mut);display:flex;gap:6px;align-items:center">Eres <select id="yo"></select></label>
    </div>
    <div id="list"></div>
  </div>
